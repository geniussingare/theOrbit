name: docs

# Builds the docs with strict link checking so a broken page is caught in the pull request.
# The website itself is deployed by Vercel (see vercel.json).

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "vercel.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir public/docs
      - name: Add landing page
        run: cp -r website/. public/
