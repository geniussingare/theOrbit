[workspace]
resolver = "2"
members = ["crates/orbit-core", "crates/orbit-input", "crates/orbit-render", "crates/orbit-sys", "crates/orbit-app", "crates/orbit-settings"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
