[package]
name = "orbit-sys"
description = "OS integration shared by TheOrbit's binaries: actions, icons, paths, status."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orbit-core = { path = "../orbit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
enigo = "0.6"
dirs = "6"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "objc2-core-graphics"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }
