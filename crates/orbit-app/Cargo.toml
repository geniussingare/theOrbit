[package]
name = "orbit-app"
description = "TheOrbit resident app: tray, global hook and the native ring overlay."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "theorbit"
path = "src/main.rs"

[dependencies]
orbit-core = { path = "../orbit-core" }
orbit-input = { path = "../orbit-input" }
orbit-render = { path = "../orbit-render" }
orbit-sys = { path = "../orbit-sys" }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
fs4 = "1"
log = "0.4"
open = "5"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSColor", "NSScreen", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.14", features = ["shape"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
